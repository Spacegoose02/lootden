<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:" />
    <title>LootDen (offline)</title>
    <style>
      /* Colours come from the theme picked in the app (kept by the desktop app while online); these are Wavelength's. */
      :root { --bg: #0d0820; --bg2: #160d33; --panel: #1e1342; --border: #3a2a6e; --text: #f3eeff; --muted: #b3a6d9; --accent: #ff4fd8; --accent2: #2ef2ff; --accentText: #12051f; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.5 "Segoe UI", system-ui, sans-serif; overflow-x: hidden; }
      /* The selected game's cover, blurred behind everything, like a console's home screen. */
      .backdrop { position: fixed; inset: -40px; z-index: -2; background: radial-gradient(900px 500px at 10% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%), radial-gradient(800px 480px at 100% 0%, color-mix(in srgb, var(--accent2) 16%, transparent), transparent 60%), var(--bg); background-size: cover; background-position: center; transition: background-image 0.4s; }
      .backdrop.art { filter: blur(40px) saturate(1.2) brightness(0.35); }
      .gridlines { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(color-mix(in srgb, var(--accent2) 6%, transparent) 1px, transparent 1px) 0 0 / 44px 44px, linear-gradient(90deg, color-mix(in srgb, var(--accent2) 6%, transparent) 1px, transparent 1px) 0 0 / 44px 44px; mask-image: linear-gradient(180deg, transparent, #000 30%, #000 70%, transparent); }
      header { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1.5rem; padding-top: calc(var(--lootden-titlebar, 0px) + 0.5rem); flex-wrap: wrap; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid color-mix(in srgb, var(--accent2) 25%, transparent); position: sticky; top: 0; z-index: 2; }
      header img { width: 40px; height: 40px; }
      header h1 { margin: 0; font-size: 1.25rem; letter-spacing: 0.02em; }
      .pill { display: inline-flex; align-items: center; gap: 0.45em; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; padding: 0.25em 0.75em; border-radius: 999px; color: #ffcf5c; border: 1px solid rgba(255, 207, 92, 0.5); background: rgba(255, 207, 92, 0.1); }
      .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #ffcf5c; box-shadow: 0 0 8px #ffcf5c; animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.35; } }
      .status { flex: 1; min-width: 14rem; color: var(--muted); margin: 0; font-size: 0.92rem; }
      .status b { color: var(--text); }
      .clock { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--muted); }
      main { padding: 1rem 1.5rem 2rem; }
      .spotlight { display: flex; align-items: flex-end; gap: 1.5rem; min-height: 9rem; margin-bottom: 1.25rem; }
      .spotlight .eyebrow { margin: 0; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent2); }
      .spotlight h2 { margin: 0.1em 0 0.15em; font-size: clamp(1.6rem, 4vw, 2.6rem); line-height: 1.1; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.5); }
      .spotlight p { margin: 0; color: var(--muted); }
      .bar { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
      .bar h3 { margin: 0 auto 0 0; display: flex; align-items: center; gap: 0.6rem; font-size: 1.1rem; }
      .bar h3::before { content: ""; width: 4px; height: 1.1em; border-radius: 2px; background: linear-gradient(180deg, var(--accent), var(--accent2)); box-shadow: 0 0 10px var(--accent); }
      input { font: inherit; padding: 0.55em 1em; border-radius: 12px; border: 1px solid var(--border); background: color-mix(in srgb, var(--bg2) 85%, transparent); color: inherit; min-width: 16rem; }
      button { font: inherit; font-weight: 700; padding: 0.55em 1.2em; border: 0; border-radius: 999px; cursor: pointer; color: var(--accentText); background: linear-gradient(135deg, var(--accent), var(--accent2)); }
      button.ghost { background: color-mix(in srgb, var(--panel) 80%, transparent); color: var(--text); font-weight: 600; border: 1px solid var(--border); }
      button:disabled { opacity: 0.6; cursor: default; }
      :focus-visible { outline: 3px solid var(--accent2); outline-offset: 3px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
      .card { background: color-mix(in srgb, var(--panel) 75%, transparent); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; backdrop-filter: blur(8px); }
      .card:focus-within { transform: translateY(-4px); border-color: var(--accent2); box-shadow: 0 0 0 1px var(--accent2), 0 0 26px color-mix(in srgb, var(--accent2) 45%, transparent); }
      .card :focus-visible { outline-offset: 2px; }
      .cover { aspect-ratio: 3 / 4; background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 30%, var(--panel)), var(--bg2)); display: grid; place-items: center; text-align: center; padding: 1rem; font-weight: 800; color: var(--text); text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); }
      .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .card .cover:has(img) { padding: 0; }
      .info { padding: 0.6rem 0.75rem 0.75rem; display: flex; flex-direction: column; gap: 0.4rem; flex: 1; }
      .title { font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .meta { color: var(--muted); font-size: 0.82rem; }
      .actions { display: flex; gap: 0.4rem; margin-top: auto; }
      .actions button { padding: 0.4em 0.9em; font-size: 0.9rem; white-space: nowrap; }
      .actions .play { flex: 1; }
      .message { color: var(--muted); }
      .empty { grid-column: 1 / -1; text-align: center; padding: 3rem 1rem; border: 1px dashed var(--border); border-radius: 14px; }
      .hints { position: fixed; right: 1.25rem; bottom: 0.9rem; display: flex; gap: 1rem; font-size: 0.82rem; color: var(--muted); background: color-mix(in srgb, var(--bg) 75%, transparent); padding: 0.35rem 0.9rem; border-radius: 999px; border: 1px solid var(--border); backdrop-filter: blur(8px); }
      .hints kbd { font: inherit; font-weight: 800; display: inline-grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%; margin-right: 0.3em; color: var(--accentText); background: var(--accent2); }
      .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
      .chips button { padding: 0.35em 0.9em; font-size: 0.85rem; font-weight: 700; color: var(--text); background: color-mix(in srgb, var(--panel) 80%, transparent); border: 1px solid var(--border); }
      .chips button[aria-checked="true"] { color: var(--accentText); background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; }
      .chips .dot { display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%; margin-right: 0.4em; background: var(--launcher, var(--accent)); }
      .chips .n { opacity: 0.7; margin-left: 0.35em; font-size: 0.85em; }
      .cover { position: relative; }
      .launcher { position: absolute; top: 8px; right: 8px; font-size: 0.68rem; font-weight: 800; padding: 0.15em 0.6em; border-radius: 999px; color: #fff; background: var(--launcher, var(--accent)); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4); text-shadow: none; }
      .card.store .cover:not(:has(img)) { background: linear-gradient(160deg, color-mix(in srgb, var(--launcher, var(--accent)) 55%, var(--panel)), var(--bg2)); }
      .l-lootden { --launcher: var(--accent); } .l-steam { --launcher: #1a9fff; } .l-epic { --launcher: #5c5c66; } .l-gog { --launcher: #86328a; } .l-xbox { --launcher: #107c10; } .l-ubisoft { --launcher: #0070ff; } .l-ea { --launcher: #ff4747; } .l-itch { --launcher: #fa5c5c; }
      .sync { color: #ffcf5c; }
      .error { color: #ff5c7a; min-height: 1.5em; margin: 0 0 0.5rem; }
      /* No system title bar: the top strip moves the window, the buttons sit at its right. */
      html[data-lootden-frame="hidden"] body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: var(--lootden-titlebar, 40px); -webkit-app-region: drag; z-index: 3; }
      html[data-handheld="on"] body { font-size: 19px; }
      html[data-handheld="on"] .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
      html:not([data-handheld="on"]) .hints { display: none; }
      @media (max-width: 720px) { .spotlight { display: none; } .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); } }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    </style>
  </head>
  <body>
    <div class="backdrop" id="backdrop"></div>
    <div class="gridlines"></div>
    <header>
      <img src="../build/icon.png" alt="" />
      <h1>LootDen</h1>
      <span class="pill">Offline</span>
      <p class="status" id="status">Can't reach your server.</p>
      <span class="clock" id="clock"></span>
      <button id="retry">Try again</button>
      <button class="ghost" id="change">Change server</button>
    </header>
    <main>
      <section class="spotlight" id="spotlight" aria-live="polite"></section>
      <div class="bar">
        <h3>Installed on this PC</h3>
        <div class="chips" id="chips" role="radiogroup" aria-label="Launcher"></div>
        <span class="message" id="count"></span>
        <input type="search" id="search" placeholder="Search games on this PC" aria-label="Search" />
      </div>
      <p class="error" id="err" role="alert"></p>
      <div class="grid" id="grid"></div>
    </main>
    <div class="hints" aria-hidden="true"><span><kbd>A</kbd>Select</span><span><kbd>Y</kbd>Try again</span></div>
    <script>
      const off = window.lootdenOffline;
      const $ = (id) => document.getElementById(id);
      let games = [];
      let playing = null;
      let launcher = "";
      const LAUNCHER_NAMES = { lootden: "LootDen" };
      const cls = (id) => `l-${String(id).replace(/[^a-z0-9-]/gi, "")}`;

      const platformName = (p) => (p && p !== "pc" ? p.toUpperCase() : "");
      const cleanError = (x) => String(x?.message || x).replace(/^Error invoking remote method '[^']+': (Error: )?/, "");

      function render() {
        const q = $("search").value.trim().toLowerCase();
        const shown = games.filter((g) => (!q || g.title.toLowerCase().includes(q)) && (!launcher || g.launcher === launcher));
        const grid = $("grid");
        grid.replaceChildren();
        $("count").textContent = games.length ? `${shown.length} of ${games.length} installed` : "";
        renderChips();
        if (!games.length) {
          const p = document.createElement("p");
          p.className = "message empty";
          p.textContent = "No games are installed on this PC yet. Install some while connected to your server and they'll be playable here offline.";
          grid.append(p);
          return;
        }
        for (const g of shown) {
          const card = document.createElement("article");
          card.className = `card ${cls(g.launcher)}${g.kind === "store" ? " store" : ""}`;
          const cover = document.createElement("div");
          cover.className = "cover";
          if (g.kind === "store") {
            // The cover kept from the server (or Steam's own), else the title on the launcher's colour.
            if (g.cover) cover.append(Object.assign(document.createElement("img"), { src: g.cover, alt: "" }));
            else cover.textContent = g.title;
            cover.append(Object.assign(document.createElement("span"), { className: "launcher", textContent: g.store }));
            const info = document.createElement("div");
            info.className = "info";
            const title = Object.assign(document.createElement("div"), { className: "title", textContent: g.title });
            const meta = Object.assign(document.createElement("div"), { className: "meta", textContent: `Plays through ${g.store}` });
            const actions = Object.assign(document.createElement("div"), { className: "actions" });
            const play = Object.assign(document.createElement("button"), { className: "play", textContent: "▶ Play", title: `Starts it through ${g.store}; some launchers need their own offline mode` });
            play.addEventListener("click", () => off.launchStore(g.launchUrl).catch((x) => ($("err").textContent = cleanError(x))));
            actions.append(play);
            info.append(title, meta, actions);
            card.append(cover, info);
            card.addEventListener("focusin", () => spotlight(g));
            card.addEventListener("pointerenter", () => spotlight(g));
            grid.append(card);
            continue;
          }
          if (g.cover) {
            const img = document.createElement("img");
            img.src = g.cover;
            img.alt = "";
            cover.append(img);
          } else cover.textContent = g.title;
          const info = document.createElement("div");
          info.className = "info";
          const title = document.createElement("div");
          title.className = "title";
          title.textContent = g.title;
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = [platformName(g.platform), g.version ? `v${g.version}` : "", g.needsSetup ? "Installer not run yet" : ""].filter(Boolean).join(" · ") || " ";
          const actions = document.createElement("div");
          actions.className = "actions";
          const play = document.createElement("button");
          play.className = "play";
          play.textContent = playing === g.gameId ? "Playing…" : "▶ Play";
          play.disabled = !!g.needsSetup || playing === g.gameId;
          play.title = g.needsSetup ? "Run the installer while connected to your server first" : "";
          play.addEventListener("click", () => start(g.gameId));
          const folder = document.createElement("button");
          folder.className = "ghost";
          folder.textContent = "Folder";
          folder.title = "Open the game's folder";
          folder.addEventListener("click", () => off.openFolder(g.gameId).catch((x) => ($("err").textContent = cleanError(x))));
          actions.append(play, folder);
          info.append(title, meta, actions);
          card.append(cover, info);
          card.addEventListener("focusin", () => spotlight(g));
          card.addEventListener("pointerenter", () => spotlight(g));
          grid.append(card);
        }
      }

      /** One chip per launcher with games here, when there's more than one. */
      function renderChips() {
        const box = $("chips");
        const ids = [...new Set(games.map((g) => g.launcher))].sort((a, b) => (a === "lootden" ? -1 : b === "lootden" ? 1 : (LAUNCHER_NAMES[a] ?? a).localeCompare(LAUNCHER_NAMES[b] ?? b)));
        box.replaceChildren();
        if (ids.length < 2) return;
        const chip = (id, label, n) => {
          const b = document.createElement("button");
          b.setAttribute("role", "radio");
          b.setAttribute("aria-checked", String(launcher === id));
          if (id) b.append(Object.assign(document.createElement("span"), { className: `dot ${cls(id)}` }));
          b.append(label, Object.assign(document.createElement("span"), { className: "n", textContent: String(n) }));
          b.addEventListener("click", () => {
            launcher = id;
            render();
            box.querySelector('[aria-checked="true"]')?.focus();
          });
          return b;
        };
        box.append(chip("", "All", games.length), ...ids.map((id) => chip(id, LAUNCHER_NAMES[id] ?? id, games.filter((g) => g.launcher === id).length)));
      }

      /** The selected game, big at the top, with its cover blurred behind the page. */
      function spotlight(g) {
        const box = $("spotlight");
        const eyebrow = Object.assign(document.createElement("p"), { className: "eyebrow", textContent: playing === g.gameId ? "Playing now" : "Ready to play" });
        const title = Object.assign(document.createElement("h2"), { textContent: g.title });
        const installed = g.kind === "store" ? g.store : g.installedAt ? `Installed ${new Date(g.installedAt).toLocaleDateString()}` : "";
        const meta = Object.assign(document.createElement("p"), { textContent: [platformName(g.platform), g.version ? `v${g.version}` : "", installed].filter(Boolean).join(" · ") });
        const text = document.createElement("div");
        text.append(eyebrow, title, meta);
        box.replaceChildren(text);
        const back = $("backdrop");
        back.classList.toggle("art", !!g.cover);
        back.style.backgroundImage = g.cover ? `url("${g.cover}")` : "";
      }

      /** The theme picked in the app, so offline looks like the rest of LootDen. */
      function applyTheme(theme) {
        if (!theme) return;
        for (const [k, v] of Object.entries(theme)) if (/^#[0-9a-f]{3,8}$/i.test(v)) document.documentElement.style.setProperty(`--${k}`, v);
      }

      const tick = () => ($("clock").textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
      tick();
      setInterval(tick, 15000);

      async function start(gameId) {
        $("err").textContent = "";
        try {
          await off.play(gameId);
        } catch (x) {
          $("err").textContent = cleanError(x);
        }
      }

      async function load() {
        try {
          const lib = await off.library();
          applyTheme(lib.theme);
          const own = lib.games.map((g) => ({ ...g, kind: "lootden", launcher: "lootden" }));
          const stores = (lib.stores ?? []).map((g) => ({ ...g, kind: "store", launcher: g.addon, gameId: `${g.addon}:${g.externalId}` }));
          for (const g of stores) LAUNCHER_NAMES[g.addon] = g.store;
          games = [...own, ...stores].sort((a, b) => a.title.localeCompare(b.title));
          const status = $("status");
          status.replaceChildren("Can't reach ", Object.assign(document.createElement("b"), { textContent: lib.server || "your server" }), ". Games on this PC still play; play time is sent when you're back online. ");
          if (lib.pendingPlays) status.append(Object.assign(document.createElement("span"), { className: "sync", textContent: `${lib.pendingPlays} play ${lib.pendingPlays === 1 ? "session is" : "sessions are"} waiting to sync. ` }));
          status.append(Object.assign(document.createElement("span"), { id: "next" }));
          render();
          const newest = games.filter((g) => g.kind === "lootden").sort((a, b) => String(b.installedAt).localeCompare(String(a.installedAt)))[0];
          if (newest) spotlight(newest);
          if (!document.activeElement || document.activeElement === document.body) document.querySelector(".grid button:not(:disabled)")?.focus();
        } catch (x) {
          $("err").textContent = cleanError(x);
        }
      }

      async function retry(quiet) {
        const b = $("retry");
        b.disabled = true;
        if (!quiet) b.textContent = "Connecting…";
        try {
          if (!(await off.retry()) && !quiet) $("err").textContent = "Still can't reach the server.";
        } catch (x) {
          if (!quiet) $("err").textContent = cleanError(x);
        } finally {
          b.disabled = false;
          b.textContent = "Try again";
        }
      }

      $("retry").addEventListener("click", () => retry(false));
      $("change").addEventListener("click", () => off.changeServer());
      $("search").addEventListener("input", render);
      window.lootden?.onProgress((p) => {
        if (p.type === "playing") playing = p.gameId;
        else if ((p.type === "stopped" || p.type === "error") && playing === p.gameId) playing = null;
        if (p.type === "error") $("err").textContent = p.message;
        if (["playing", "stopped", "error"].includes(p.type)) render();
      });
      // Back home: pick the server up again on its own while no game is running, saying when it'll look next.
      let nextTry = 30;
      setInterval(() => {
        if (playing || document.visibilityState !== "visible") return;
        nextTry -= 1;
        const next = $("next");
        if (next) next.textContent = nextTry > 0 ? `Checking again in ${nextTry}s.` : "Checking…";
        if (nextTry <= 0) {
          nextTry = 30;
          void retry(true);
        }
      }, 1000);

      // Controllers and arrow keys move between buttons; A or Enter presses.
      function move(dx, dy) {
        const items = [...document.querySelectorAll("button:not(:disabled), input")];
        const cur = document.activeElement;
        if (!items.includes(cur)) return items[0]?.focus();
        const r = cur.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        let best = null, bestScore = Infinity;
        for (const el of items) {
          if (el === cur) continue;
          const o = el.getBoundingClientRect();
          const ox = o.left + o.width / 2 - cx, oy = o.top + o.height / 2 - cy;
          const along = dx ? ox * dx : oy * dy;
          if (along <= 4) continue;
          const score = along + 3 * Math.abs(dx ? oy : ox);
          if (score < bestScore) (best = el), (bestScore = score);
        }
        best?.focus();
        best?.scrollIntoView({ block: "nearest" });
      }
      const KEYS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
      document.addEventListener("keydown", (e) => {
        if (!KEYS[e.key] || (e.target.tagName === "INPUT" && (e.key === "ArrowLeft" || e.key === "ArrowRight"))) return;
        e.preventDefault();
        move(...KEYS[e.key]);
      });
      let held = {};
      // A held direction repeats, like the main app: a short pause, then steadily.
      const repeatAt = {};
      function poll() {
        for (const pad of navigator.getGamepads?.() ?? []) {
          if (!pad) continue;
          const ax = pad.axes[0] ?? 0, ay = pad.axes[1] ?? 0;
          // The stick moves along whichever way it's pushed most.
          const sx = Math.abs(ax) >= Math.abs(ay) ? ax : 0, sy = Math.abs(ay) > Math.abs(ax) ? ay : 0;
          const now = {
            up: pad.buttons[12]?.pressed || sy < -0.55,
            down: pad.buttons[13]?.pressed || sy > 0.55,
            left: pad.buttons[14]?.pressed || sx < -0.55,
            right: pad.buttons[15]?.pressed || sx > 0.55,
            a: pad.buttons[0]?.pressed,
            b: pad.buttons[1]?.pressed,
            y: pad.buttons[3]?.pressed,
          };
          const pressed = (k) => now[k] && !held[k];
          const t = performance.now();
          const dir = (k, dx, dy) => {
            if (!now[k]) return void delete repeatAt[k];
            if (pressed(k)) repeatAt[k] = t + 300;
            else if (t < repeatAt[k]) return;
            else repeatAt[k] = t + 110;
            move(dx, dy);
          };
          dir("up", 0, -1);
          dir("down", 0, 1);
          dir("left", -1, 0);
          dir("right", 1, 0);
          // B leaves the search box, then clears the launcher filter.
          if (pressed("b")) {
            if (document.activeElement?.tagName === "INPUT") document.activeElement.blur();
            else if (launcher) (launcher = ""), render();
          }
          if (pressed("a")) document.activeElement?.click();
          if (pressed("y")) void retry(false);
          held = now;
          break;
        }
        requestAnimationFrame(poll);
      }
      requestAnimationFrame(poll);

      void load();
    </script>
  </body>
</html>
