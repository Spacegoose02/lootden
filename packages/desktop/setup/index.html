<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:" />
    <title>Connect to your LootDen server</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(900px 500px at 10% -10%, #3b136b, transparent 60%), #0d0820; color: #f3eeff; font: 16px/1.5 "Segoe UI", system-ui, sans-serif; }
      form { width: min(440px, 90vw); background: rgba(36, 22, 74, 0.8); border: 1px solid rgba(160, 120, 255, 0.25); border-radius: 18px; padding: 2rem; display: flex; flex-direction: column; gap: 1rem; text-align: center; }
      input { font: inherit; padding: 0.8em 1em; border-radius: 12px; border: 1px solid rgba(160, 120, 255, 0.35); background: #160d33; color: inherit; }
      button { font: inherit; font-weight: 700; padding: 0.8em; border: 0; border-radius: 999px; background: linear-gradient(135deg, #ff4fd8, #2ef2ff); color: #12051f; cursor: pointer; }
      .muted { color: #b3a6d9; margin: 0; }
      .error { color: #ff5c7a; min-height: 1.5em; margin: 0; }
      img { align-self: center; }
      /* No system title bar: the top strip moves the window, the buttons sit at its right. */
      html[data-lootden-frame="hidden"] body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: var(--lootden-titlebar, 40px); -webkit-app-region: drag; }
    </style>
  </head>
  <body>
    <form id="f">
      <img src="../build/mascot.png" width="160" height="160" alt="" onerror="this.onerror = () => this.remove(); this.src = '../build/icon.png'" />
      <h1 style="margin: 0">LootDen</h1>
      <p class="muted">Enter the address of your LootDen server, for example <b>http://tower:8080</b>.</p>
      <input id="url" placeholder="http://tower:8080" autofocus required />
      <button>Connect</button>
      <p class="error" id="err"></p>
    </form>
    <script>
      document.getElementById("f").addEventListener("submit", async (e) => {
        e.preventDefault();
        const err = document.getElementById("err");
        err.textContent = "Connecting…";
        try {
          await window.lootdenSetup.connect(document.getElementById("url").value.trim());
        } catch (x) {
          err.textContent = String(x.message || x).replace(/^Error invoking remote method '[^']+': (Error: )?/, "");
        }
      });
    </script>
  </body>
</html>
