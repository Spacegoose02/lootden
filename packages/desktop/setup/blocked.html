<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Blocked</title>
    <style>
      /* Shown in a browser tab instead of a site the person's browser rules don't allow. */
      html, body { height: 100%; }
      body { margin: 0; display: grid; place-items: center; background: #0d0820; color: #f3eeff; font: 16px/1.5 "Segoe UI", system-ui, sans-serif; text-align: center; padding: 1.5rem; box-sizing: border-box; }
      .box { max-width: 560px; }
      .icon { font-size: 4rem; line-height: 1; }
      h1 { font-size: 1.6rem; margin: 0.6rem 0; }
      p { color: #b3a6d9; margin: 0.4rem 0; }
      strong { color: #f3eeff; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="icon" aria-hidden="true">🛡️</div>
      <h1 id="title">This site is blocked</h1>
      <p id="why"></p>
    </div>
    <script>
      const q = new URLSearchParams(location.search);
      const site = (q.get("site") || "").slice(0, 200);
      const kids = q.get("kids") === "1";
      if (site) document.getElementById("title").textContent = `${site} is blocked`;
      document.getElementById("why").textContent = kids
        ? "This is a kid-safe browser, so only sites made for kids open here. Ask a grown-up to add this one in LootDen's settings if it's OK."
        : "An admin has blocked this site for you in LootDen's settings.";
    </script>
  </body>
</html>
