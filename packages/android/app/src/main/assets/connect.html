<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LootDen</title>
<style>
  :root { color-scheme: dark; --bg: #120c24; --panel: #1d1538; --text: #f1ecff; --muted: #a99fc9; --accent: #ff9f1c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 18px/1.45 system-ui, sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; padding: 24px; }
  .card { width: min(560px, 100%); background: var(--panel); border-radius: 18px; padding: 28px; box-shadow: 0 10px 40px #0007; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  p { color: var(--muted); margin: 0 0 18px; }
  input { width: 100%; font: inherit; padding: 14px 16px; border-radius: 12px; border: 2px solid #3a2f63; background: #0d0920; color: var(--text); }
  input:focus, button:focus { outline: 3px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; padding: 12px 22px; min-height: 52px; border-radius: 12px; border: 0; background: var(--accent); color: #1a1000; }
  button.ghost { background: transparent; color: var(--text); border: 2px solid #3a2f63; }
  .error { color: #ff7a7a; min-height: 1.4em; margin: 12px 0 0; }
  small { color: var(--muted); display: block; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <form class="card" id="form">
    <h1>LootDen</h1>
    <p id="lead">Enter your LootDen server's address, the one you open in a browser.</p>
    <input id="url" type="url" inputmode="url" autocomplete="url" placeholder="http://192.168.1.10:8080" autofocus>
    <div class="row">
      <button id="go" type="submit">Connect</button>
      <button id="retry" class="ghost" type="button" hidden>Try again</button>
    </div>
    <p class="error" id="error" role="alert"></p>
    <small>Games you install go to a ROMs folder and play in RetroArch or your emulators. PC games stream from a PC with Moonlight.</small>
  </form>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const url = document.getElementById("url");
  const error = document.getElementById("error");
  const retry = document.getElementById("retry");
  url.value = q.get("server") || "";
  if (q.get("error")) {
    error.textContent = q.get("error");
    document.getElementById("lead").textContent = "LootDen can't reach the server right now.";
    retry.hidden = !q.get("server");
  }
  window.lootdenConnected = (message) => {
    document.getElementById("go").disabled = false;
    error.textContent = message || "";
  };
  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    error.textContent = "";
    document.getElementById("go").disabled = true;
    window.LootDenSetup.connect(url.value.trim());
  });
  retry.addEventListener("click", () => window.LootDenSetup.connect(q.get("server")));
  // A controller's A button presses the focused button; the d-pad moves between them.
  document.addEventListener("keydown", (e) => {
    const items = [url, document.getElementById("go"), ...(retry.hidden ? [] : [retry])];
    const i = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown" || e.key === "ArrowRight") { if (e.target !== url || e.key === "ArrowDown") { items[Math.min(items.length - 1, i + 1)].focus(); e.preventDefault(); } }
    if (e.key === "ArrowUp" || e.key === "ArrowLeft") { if (e.target !== url || e.key === "ArrowUp") { items[Math.max(0, i - 1)].focus(); e.preventDefault(); } }
  });
</script>
</body>
</html>
