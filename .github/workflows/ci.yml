name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -w @lootden/desktop

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lootden-smoke .
      # Starts it as root and as Unraid's 99:100 and waits for /api/health.
      - run: sh scripts/docker-smoke.sh lootden-smoke

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug lintDebug --no-daemon
        working-directory: packages/android

  playnite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: dotnet build playnite/LootDenLibrary -c Release
