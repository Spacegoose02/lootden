# Push a tag like v0.2.0 to publish the Docker image to GitHub Container Registry
# and attach the desktop app, Android app, CLI and Playnite plugin to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      # Never publish an image that doesn't start: build it locally and run it first.
      - uses: docker/build-push-action@v6
        with:
          load: true
          tags: lootden-smoke
      - run: sh scripts/docker-smoke.sh lootden-smoke
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run dist:${{ matrix.target }} -w @lootden/desktop
      - run: npm run package:${{ matrix.target }} -w @lootden/client
      # The CLI needs the 7za beside it, so ship each platform folder as one archive.
      - if: matrix.target == 'win'
        run: Compress-Archive -Path packages/client/release/win-x64/* -DestinationPath packages/client/release/lootden-cli-win-x64.zip
      - if: matrix.target == 'linux'
        run: |
          tar -czf packages/client/release/lootden-cli-linux-x64.tar.gz -C packages/client/release/linux-x64 .
          tar -czf packages/client/release/lootden-cli-linux-arm64.tar.gz -C packages/client/release/linux-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/client/release/lootden-cli-*

  # The Android app, signed with the key in the ANDROID_* secrets so each version installs over the
  # last. Without them it's signed with a throwaway debug key and can't update an earlier copy.
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/lootden.jks"
          echo "LOOTDEN_ANDROID_KEYSTORE=$RUNNER_TEMP/lootden.jks" >> "$GITHUB_ENV"
      - if: env.KEYSTORE == ''
        run: echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so the APK is debug-signed and won't update an installed copy."
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: packages/android
        env:
          LOOTDEN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LOOTDEN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LOOTDEN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: cp packages/android/app/build/outputs/apk/release/app-release.apk "LootDen-${GITHUB_REF_NAME#v}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: LootDen-*.apk

  playnite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: dotnet build playnite/LootDenLibrary -c Release -o playnite-out
      - run: Compress-Archive -Path playnite-out/* -DestinationPath LootDen-playnite.zip
      - uses: actions/upload-artifact@v4
        with:
          name: playnite
          path: LootDen-playnite.zip

  release:
    needs: [desktop, android, playnite]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        # Skip the docker build record; one folder per artifact so merges do not race.
        with:
          path: dist
          pattern: "{desktop-*,android,playnite}"
      # The desktop apps check updates against this before installing them (updater.ts).
      # A block scalar, because in a plain one the "  #" in the sed below starts a YAML comment.
      - run: |
          find dist -type f -exec sha256sum {} + | sed 's#  .*/#  #' | sort -k2 > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
            SHA256SUMS
          generate_release_notes: true
